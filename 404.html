<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Celal Topcu</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script>
  (function () {
    var lang = 'en', theme = 'dark';
    try {
      lang = localStorage.getItem('site-lang') ||
        (navigator.language && navigator.language.toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en');
      theme = localStorage.getItem('site-theme') || 'dark';
    } catch (e) {}
    document.documentElement.className = 'lang-' + lang + ' theme-' + theme;
    document.documentElement.lang = lang;
  })();
</script>
</head>
<body>

<header class="nav-wrap">
  <nav class="nav container">
    <a href="/" class="logo">Celal Topcu<span class="mark">.</span></a>
  </nav>
</header>

<main class="article">
  <p class="mono">404</p>
  <h1 style="margin-top:0.6rem">
    <span class="t-en">This page is not here</span>
    <span class="t-tr">Bu sayfa burada değil</span>
  </h1>
  <p style="margin-top:1.2rem">
    <span class="t-en">The address may be mistyped, or the page may have moved. The front page has everything.</span>
    <span class="t-tr">Adres yanlış yazılmış ya da sayfa taşınmış olabilir. Ana sayfada her şey var.</span>
  </p>
  <p style="margin-top:1.8rem">
    <a href="/" class="btn btn-primary"><span class="t-en">Front page</span><span class="t-tr">Ana sayfa</span></a>
  </p>
</main>

<footer class="footer">
  <div class="container">
    <p class="mono">&copy; 2026 Celal Topcu</p>
    <p class="mono"><a href="mailto:contact@celaltopcu.com" class="backlink">contact@celaltopcu.com</a></p>
  </div>
</footer>

</body>
</html>
